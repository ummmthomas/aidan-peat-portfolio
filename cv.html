age":true,"is_video":false,"is_url":false,"in_use":true,"created_at":"2026-10-09T10:36:16.553810Z","updated_at":"2026-10-09T10:36:16.553810Z"}],"tags":[],"access_level":"public"},"O2990445286":{"id":"O2990445286","title":"PC Project","purl":"pc-project","page_type":"page","content":"\u003ccolumn-set gutter=\"1\" mobile-stack=\"false\">\u003ccolumn-unit slot=\"0\" span=\"10\">Philip Colbert\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"2\">\u003cdiv style=\"text-align: right\">\u003ca href=\"#\" rel=\"close-overlay\">(Close)\u003c/a>\u003c/div>\u003c/column-unit>\u003c/column-set>\u003cbr />\n\u003cgallery-columnized columns=\"2\" gutter=\"1rem\" mobile-gutter=\"1rem\">\u003cmedia-item class=\"zoomable\" hash=\"U3171054481765469483325331996953\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"S3169204695949783143984074719513\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"N3171040933019328969207570628889\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"R3171027368907050641689752764697\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"Y3171041771442293863380401127705\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"O3171050167570092732651366908185\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"Y3171041900975330748968872575257\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"J3169206855676132549824668369177\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"G3171048475450258851274197172505\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"O3169203921647700650025645637913\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"Z3169203803994366947906125431065\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"D3171045436090918290593634713881\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"Q3169220177103045843619625173273\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"K3169209191550441115517770400025\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"S3169206095153767878927274344729\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"Y3172347487088255573614212284697\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"L3169204842472271321459043205401\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"X3171027045480286797340184281369\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"X3169209039032761114087197638937\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"N3171028326293068067215481635097\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"R3169208701826279446676594098457\">\u003c/media-item>\u003c/gallery-columnized>\u003cbr />\n\u003ccolumn-set gutter=\"1\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"5\">\u003cdiv style=\"text-align: left\">\u003cspan class=\"caption\">Born in Scotland and living and working in London, Colbert is often referred to as the “godson of Andy Warhol”. He has created a global following for his cartoon lobster persona and his masterful hyper-pop history paintings. His work powerfully explores the patterns of contemporary digital culture and its relationship to a deeper art historical dialogue.\u003cbr />\u003cbr />Colbert’s work has received international acclaim in museums and galleries worldwide for his energetic new approach to painting and pop theory. Following on from early Pop painters such as Richard Hamilton, Roy Lichtenstein and James Rosenquist, Colbert’s paintings cross high art themes from old master paintings and contemporary art theory with everyday symbols of mass contemporary culture, all narrated through the eyes of Colbert’s cartoon Lobster alter ego. He has been championed as a contemporary pop master by art world figures such as Charles Saatchi &#x26; Simon de Pury.\u003cbr />\n\n\u003cbr />During my time with Colbert, I’ve had the pleasure of working on a wide range of projects; high-end collectable artworks, documentaries, global exhibition advertisements, paintings, books, and football stadium animations.\u003cbr />\n\u003cbr />\u003c/span>\u003c/div>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"7\">\u003cdiv style=\"text-align: left\">\u003cspan class=\"caption\">Galleries include:\u003cbr />\u003cul>\u003cli>Saatchi Gallery, London\u003cbr />\u003c/li>\u003cli>The Archaeological Site of Pompeii\u003cbr />\u003c/li>\u003cli>Lightbox Gallery, Woking\u003cbr />\u003c/li>\u003cli>\nThe National Archaeological Museum of Naples\u003cbr />\u003c/li>\u003cli>\nWhitestone Gallery, Taipei and Singapore\u003cbr />\u003c/li>\u003cli>\nPearl Lam Galleries, Shenzhen, Hong Kong and Tokyo\u003cbr />\u003c/li>\u003cli>\nKaruizawa New Art Museum, Japan\u003cbr />\u003c/li>\u003cli>\nThe Page Gallery, Seoul\u003cbr />\u003c/li>\u003c/ul>\n\n\u003cbr />Collaborations include:\u003cbr />\u003cul>\u003cli>Johnnie Walker\u003cbr />\u003c/li>\u003cli>Casetify\u003cbr />\u003c/li>\u003cli>\nAS Roma\u003cbr />\u003c/li>\u003cli>\nBentley\u003cbr />\u003c/li>\u003cli>\nVogue Singapore\u003cbr />\u003c/li>\u003cli>\nVogue Korea\n\u003cbr />\u003c/li>\u003cli>\nTeam GB\n\u003cbr />\u003c/li>\u003cli>\nConran shop\u003cbr />\u003c/li>\u003cli>\nBorough Yards\u003cbr />\u003c/li>\u003cli>\nThe Big Issue\u003c/li>\u003c/ul>\n\u003c/span>\u003c/div>\u003c/column-unit>\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003cmedia-item browser-default=\"true\" disable-zoom=\"true\" hash=\"Z3171055474587682274447109521689\">\u003c/media-item>\u003cbr />\n\u003cbr />\n\u003cbr />\n\u003ccolumn-set gutter=\"1\" mobile-hide-empty=\"false\" mobile-stack=\"false\">\u003ccolumn-unit slot=\"0\" span=\"5\">\u003cspan class=\"caption\">(\u003ca href=\"#\" rel=\"close-overlay\">Return to projects\u003c/a>)\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"7\">\u003cspan class=\"caption\">2022 - 2026\u003c/span>\u003c/column-unit>\u003c/column-set>","local_css":"[id=\"O2990445286\"].page {
