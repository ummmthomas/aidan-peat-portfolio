   secondary text, the hr hairline for rules.
   ------------------------------------------------------------------ */

.cs-kicker {
	color: rgba(0, 0, 0, 0.4);
	margin-top: 2rem;
}

.cs-headline {
	font-size: 2rem;
	line-height: 1.05;
	margin: 0.4rem 0 1rem;
	max-width: 18em;
}

.cs-standfirst {
	max-width: 34em;
	margin-bottom: 1.5rem;
}

/* At-a-glance strip: label over value, wrapping into as many columns as fit */
.cs-glance {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr));
	gap: 0.9rem 1rem;
	margin: 0 0 2rem;
	padding: 0.75rem 0;
	border-top: 1px solid rgba(0, 0, 0, 0.15);
	border-bottom: 1px solid rgba(0, 0, 0, 0.15);
	font-size: 0.9rem;
	font-weight: 450;
}

.cs-glance > div {
	min-width: 0;
}

.cs-glance dt {
	color: rgba(0, 0, 0, 0.4);
}

.cs-glance dd {
	margin: 0.15em 0 0;
}

.cs-section {
	margin: 2.5rem 0 1rem;
}

.cs-label {
	font-size: 0.9rem;
	font-weight: 450;
	color: rgba(0, 0, 0, 0.4);
	margin-bottom: 0.5rem;
}

.cs-section p {
	margin: 0 0 0.9em;
	max-width: 34em;
}

.cs-pair {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 1rem;
}

.cs-pair h3 {
	font-size: 1.05rem;
	font-weight: 650;
	margin: 0 0 0.35em;
}

.mobile .cs-pair {
	grid-template-columns: 1fr;
}

.cs-media-note {
	margin-top: 0.5rem;
}

/* Impact stats. The figure lives in data-value and is drawn by CSS, so there
   is one place to fill it in. A stat whose value is still a [[...]]
   placeholder is hidden, and a strip with no real stats hides entirely. */
.impact {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
	gap: 1.25rem 1rem;
	margin: 2.5rem 0 1rem;
	padding-top: 0.75rem;
	border-top: 1px solid rgba(0, 0, 0, 0.15);
}

.impact > .cs-label {
	grid-column: 1 / -1;
	margin: 0;
}

.impact-stat::before {
	content: attr(data-value);
	display: block;
	font-size: 2rem;
	font-weight: 750;
	line-height: 1;
	letter-spacing: -0.01em;
}

.impact-stat::after {
	content: attr(data-label);
	display: block;
	margin-top: 0.35em;
	font-size: 0.9rem;
	font-weight: 450;
	color: rgba(0, 0, 0, 0.4);
}

.impact-stat[data-value^="[["],
.impact:not(:has(.impact-stat:not([data-value^="[["]))) {
	display: none;
}

/* Testimonial: hidden until both the quote and its source are filled in */
.cs-quote {
	margin: 2.5rem 0 1rem;
	padding: 0;
	max-width: 30em;
}

.cs-quote::before {
	content: "\201C" attr(data-quote) "\201D";
	display: block;
	font-size: 1.5rem;
	font-weight: 650;
	line-height: 1.15;
}

.cs-quote::after {
	content: attr(data-cite);
	display: block;
	margin-top: 0.6em;
	font-size: 0.9rem;
	font-weight: 450;
	color: rgba(0, 0, 0, 0.4);
}

.cs-quote[data-quote^="[["],
.cs-quote[data-cite^="[["] {
	display: none;
}

.cs-credits {
	display: grid;
	grid-template-columns: 9rem 1fr;
	gap: 0.3rem 1rem;
	margin: 2.5rem 0 1rem;
	padding-top: 0.75rem;
	border-top: 1px solid rgba(0, 0, 0, 0.15);
	font-size: 0.9rem;
	font-weight: 450;
}

.cs-credits dt {
	color: rgba(0, 0, 0, 0.4);
}

.cs-credits dd {
	margin: 0;
}

.cs-next {
	margin-top: 2.5rem;
}

/* Copy still waiting on a fact from Aidan. Search the sources for "[[". */
.ph {
	background: rgba(255, 221, 0, 0.35);
}

/* Homepage */
.hero {
	padding: 4rem 0 4.5rem;
}

.hero h2 {
	max-width: 15em;
	margin-bottom: 1rem;
}

.hero-sub {
	max-width: 34em;
	margin-bottom: 1rem;
}

.index-group {
	color: rgba(0, 0, 0, 0.4);
	padding: 0.75rem 0 1rem;
	border-top: 1px solid rgba(0, 0, 0, 0.15);
}

.index-group + gallery-columnized {
	margin-bottom: 3rem;
}

/* Card metric: added by tools/build.py from the linked page's impact stats */
.card-metric {
	display: inline-block;
	margin: 0.15em 0 0.1em;
	font-size: 1.35rem;
	line-height: 1.1;
	letter-spacing: -0.01em;
}

.card-metric b {
	font-weight: 750;
}

.cs-kicker a,
.cs-section p a,
bodycopy a.cta {
	text-decoration: underline;

80401127705","width":2000,"height":1333,"file_size":2356428,"file_size_human":"2.2MB","file_type":"jpg","mime_type":"image/jpeg","is_image":true,"is_video":false,"is_url":false,"in_use":true,"created_at":"2026-10-08T14:41:59.291318Z","updated_at":"2026-10-08T14:41:59.291318Z"}],"tags":[],"access_level":"public"},"O2990445286":{"id":"O2990445286","title":"Philip Colbert, 2022–2026","purl":"pc-project","page_type":"page","content":"\u003ccolumn-set gutter=\"1\" mobile-stack=\"false\">\u003ccolumn-unit slot=\"0\" span=\"10\">Philip Colbert\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"2\">\u003cdiv style=\"text-align: right\">\u003ca href=\"#\" rel=\"close-overlay\">(Close)\u003c/a>\u003c/div>\u003c/column-unit>\u003c/column-set>\n\u003cmedia-item class=\"zoomable\" hash=\"U3171054481765469483325331996953\">\u003c/media-item>\n\u003cdiv class=\"cs-kicker\">Series · 2022–2026\u003c/div>\n\u003ch2 class=\"cs-headline\">Four years taking one artist's lobster from the canvas to whisky, sneakers, laptops and city streets.\u003c/h2>\n\u003cdiv class=\"cs-standfirst\">Born in Scotland and living and working in London, Colbert is often referred to as the \"godson of Andy Warhol\". He has created a global following for his cartoon lobster persona and his hyper-pop history paintings. During my time with Colbert, I've worked on a wide range of projects: high-end collectable artworks, documentaries, global exhibition advertisements, paintings, books, and football stadium animations.\u003c/div>\n\u003cdl class=\"cs-glance\">\n\u003cdiv>\u003cdt>Artist\u003c/dt>\u003cdd>Philip Colbert\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>Years\u003c/dt>\u003cdd>2022–2026\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>My role\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[FACT: Aidan's job title at the Colbert studio, and start and end dates]]\u003c/span>\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>Work\u003c/dt>\u003cdd>Brand partnerships, branded content, exhibition campaigns, collectables, books, animation\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>Shows\u003c/dt>\u003cdd>London, Pompeii, Naples, Rome, Taipei, Shenzhen, Macao and beyond\u003c/dd>\u003c/div>\n\u003c/dl>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">Why the lobster travels\u003c/div>\u003cp>Colbert's lobster is a character, not a logo, so it can move into other people's worlds without losing itself. It sits on a full moon for Johnnie Walker, wears the AS Roma kit, covers a Bentley and fronts The Big Issue. The work on these pages is about keeping that character unmistakably Colbert while letting each partner's own world show through.\u003c/p>\u003cp>\u003cspan class=\"ph\">[[FACT: Aidan's part across the partnership: which projects he led, which he supported]]\u003c/span>\u003c/p>\u003c/div>\n\u003cdiv class=\"impact\">\u003cdiv class=\"cs-label\">Across the partnership\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"4+ years\" data-label=\"in the studio\">\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: number of brand partnerships Aidan worked on]]\" data-label=\"brand partnerships\" data-headline=\"true\">\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: number of exhibitions Aidan designed for]]\" data-label=\"exhibitions\">\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: markets / territories launched in]]\" data-label=\"markets\">\u003c/div>\u003c/div>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">Case studies\u003c/div>\u003cgallery-columnized columns=\"2\" gutter=\"1rem\" mobile-gutter=\"1rem\">\u003cmedia-item class=\"linked\" hash=\"V3169171048055575029634192245017\" href=\"colbert-johnnie-walker\" rel=\"history\">\u003cfigcaption class=\"caption\" slot=\"caption\">\u003cspan class=\"card-metric\">\u003cb class=\"ph\">[[METRIC: sell-through / time to sell out]]\u003c/b> sold through\u003c/span>\u003cbr />Johnnie Walker    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">Limited gift boxes made to be collected\u003c/span>\u003c/figcaption>\u003c/media-item>\u003cmedia-item class=\"linked\" hash=\"D3171060658196553963125951824153\" href=\"colbert-adidas\" rel=\"history\">\u003cfigcaption class=\"caption\" slot=\"caption\">\u003cspan class=\"card-metric\">\u003cb class=\"ph\">[[METRIC: sell-through / time to sell out]]\u003c/b> sold through\u003c/span>\u003cbr />adidas    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">The Superstar, saved by a lobster\u003c/span>\u003c/figcaption>\u003c/media-item>\u003cmedia-item class=\"linked\" hash=\"S3171059006567323323541247885593\" href=\"colbert-asus\" rel=\"history\">\u003cfigcaption class=\"caption\" slot=\"caption\">\u003cspan class=\"card-metric\">\u003cb>1 of 2\u003c/b> limited artist editions\u003c/span>\u003cbr />ASUS    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">A laptop sold as a collectable\u003c/span>\u003c/figcaption>\u003c/media-item>\u003cmedia-item class=\"linked\" hash=\"R3171057385080072500397951287577\" href=\"colbert-shenzhen\" rel=\"history\">\u003cfigcaption class=\"caption\" slot=\"caption\">\u003cspan class=\"card-metric\">\u003cb>40+\u003c/b> works on show\u003c/span>\u003cbr />Shenzhen    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">A solo show announced at building scale\u003c/span>\u003c/figcaption>\u003c/media-item>\u003c/gallery-columnized>\u003c/div>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">Exhibition campaigns\u003c/div>\u003cp>A show only works if people know it's on. These are the campaigns and entrances that carried Colbert's exhibitions into the street. \u003cspan class=\"ph\">[[FACT: which of these campaigns Aidan designed]]\u003c/span>\u003c/p>\u003cgallery-columnized columns=\"2\" gutter=\"1rem\" mobile-gutter=\"1rem\">\u003cmedia-item class=\"zoomable\" hash=\"Y3171041771442293863380401127705\">\u003cfigcaption class=\"caption\" slot=\"caption\">Rome    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">The Lobster Empire, 6 Oct 2022 – 8 Jan 2023. Tour-bus wrap at Castel Sant'Angelo\u003c/span>\u003c/figcaption>\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"Z3169203803994366947906125431065\">\u003cfigcaption class=\"caption\" slot=\"caption\">Naples    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">House of the Lobster, entrance banners at the National Archaeological Museum\u003c/span>\u003c/figcaption>\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"L3169204842472271321459043205401\">\u003cfigcaption class=\"caption\" slot=\"caption\">Taipei    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">Journey to the Lobster Planet, with a Colbert-wrapped Bentley outside\u003c/span>\u003c/figcaption>\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"Q3169220177103045843619625173273\">\u003cfigcaption class=\"caption\" slot=\"caption\">Journey to the Lobster Planet    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">Title wall, 6 January – 5 March 2024\u003c/span>\u003c/figcaption>\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"X3171027045480286797340184281369\">\u003cfigcaption class=\"caption\" slot=\"caption\">Pearl Lam Galleries    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">Dreams of Lobsteropolis, title wall and installation\u003c/span>\u003c/figcaption>\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"N3171028326293068067215481635097\">\u003cfigcaption class=\"caption\" slot=\"caption\">Macao    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">Outdoor sculpture and visitor signage\u003c/span>\u003c/figcaption>\u003c/media-item>\u003c/gallery-columnized>\u003c/div>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">Brands and collectables\u003c/div>\u003cgallery-columnized columns=\"2\" gutter=\"1rem\" mobile-gutter=\"1rem\">\u003cmedia-item class=\"zoomable\" hash=\"S3169204695949783143984074719513\">\u003cfigcaption class=\"caption\" slot=\"caption\">Bentley    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">Showroom window graphics\u003c/span>\u003c/figcaption>\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"G3171048475450258851274197172505\">\u003cfigcaption class=\"caption\" slot=\"caption\">AS Roma × Philip Colbert    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">15 cm vinyl figure and box, 2023\u003c/span>\u003c/figcaption>\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"O3171050167570092732651366908185\">\u003cfigcaption class=\"caption\" slot=\"caption\">Pompeii Lobster    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">Resin edition and box, 2026\u003c/span>\u003c/figcaption>\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"R3169208701826279446676594098457\">\u003cfigcaption class=\"caption\" slot=\"caption\">The Lobster Pop History Mini    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">Vinyl figure and box, 2025\u003c/span>\u003c/figcaption>\u003c/media-item>\u003c/gallery-columnized>\u003c/div>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">Books and covers\u003c/div>\u003cgallery-columnized columns=\"2\" gutter=\"1rem\" mobile-gutter=\"1rem\">\u003cmedia-item class=\"zoomable\" hash=\"K3169209191550441115517770400025\">\u003cfigcaption class=\"caption\" slot=\"caption\">Journey to the Lobster Planet    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">Book, Karuizawa New Art Museum, 2023\u003c/span>\u003c/figcaption>\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"X3169209039032761114087197638937\">\u003cfigcaption class=\"caption\" slot=\"caption\">The Lobster Empire    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">Book, 2022\u003c/span>\u003c/figcaption>\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"N3171040933019328969207570628889\">\u003cfigcaption class=\"caption\" slot=\"caption\">Vogue Singapore    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">Issue 48, The Art Issue cover\u003c/span>\u003c/figcaption>\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"Y3172347487088255573614212284697\">\u003cfigcaption class=\"caption\" slot=\"caption\">The Big Issue    \u003cspan style=\"color: rgba(0, 0, 0, 0.4);\">Issue 1704, 9–15 February 2026, cover by Philip Colbert\u003c/span>\u003c/figcaption>\u003c/media-item>\u003c/gallery-columnized>\u003c/div>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">Showreel\u003c/div>\u003cmedia-item browser-default=\"true\" disable-zoom=\"true\" hash=\"Z3171055474587682274447109521689\">\u003c/media-item>\u003c/div>\n\u003cblockquote class=\"cs-quote\" data-quote=\"[[QUOTE: collaborator or client testimonial]]\" data-cite=\"[[FACT: name and role of the person quoted]]\">\u003c/blockquote>\n\u003ccolumn-set gutter=\"1\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"5\">\u003cdiv style=\"text-align: left\">\u003cspan class=\"caption\">Colbert's work has received international acclaim in museums and galleries worldwide for his energetic new approach to painting and pop theory. Following on from early Pop painters such as Richard Hamilton, Roy Lichtenstein and James Rosenquist, Colbert's paintings cross high art themes from old master paintings and contemporary art theory with everyday symbols of mass contemporary culture, all narrated through the eyes of Colbert's cartoon Lobster alter ego. He has been championed as a contemporary pop master by art world figures such as Charles Saatchi &#x26; Simon de Pury.\u003c/span>\u003c/div>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"7\">\u003cdiv style=\"text-align: left\">\u003cspan class=\"caption\">Galleries include:\u003cbr />\u003cul>\u003cli>Saatchi Gallery, London\u003c/li>\u003cli>The Archaeological Site of Pompeii\u003c/li>\u003cli>Lightbox Gallery, Woking\u003c/li>\u003cli>The National Archaeological Museum of Naples\u003c/li>\u003cli>Whitestone Gallery, Taipei and Singapore\u003c/li>\u003cli>Pearl Lam Galleries, Shenzhen, Hong Kong and Tokyo\u003c/li>\u003cli>Karuizawa New Art Museum, Japan\u003c/li>\u003cli>The Page Gallery, Seoul\u003c/li>\u003c/ul>\u003cbr />Collaborations include:\u003cbr />\u003cul>\u003cli>Johnnie Walker\u003c/li>\u003cli>adidas\u003c/li>\u003cli>ASUS\u003c/li>\u003cli>Casetify\u003c/li>\u003cli>AS Roma\u003c/li>\u003cli>Bentley\u003c/li>\u003cli>Vogue Singapore\u003c/li>\u003cli>Vogue Korea\u003c/li>\u003cli>Team GB\u003c/li>\u003cli>Conran Shop\u003c/li>\u003cli>Borough Yards\u003c/li>\u003cli>The Big Issue\u003c/li>\u003c/ul>\u003c/span>\u003c/div>\u003c/column-unit>\u003c/column-set>\u003cbr />\n\u003cbr />\n\u003ccolumn-set gutter=\"1\" mobile-hide-empty=\"false\" mobile-stack=\"false\">\u003ccolumn-unit slot=\"0\" span=\"5\">\u003cspan class=\"caption\">(\u003ca href=\"#\" rel=\"close-overlay\">Return to projects\u003c/a>)\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"7\">\u003cspan class=\"caption\">2022 - 2026\u003c/span>\u003c/column-unit>\u003c/column-set>","local_css":"[id=\"O2990445286\"].page {\n\tjustify-content: flex-end;\n\tmin-height: var(--viewport-height);\n\tbackground-color: rgba(255, 255, 255, 0.95);\n}\n\n[id=\"O2990445286\"] .page-layout {\n\talign-items: flex-start;\n\tmax-width: 50%;\n}\n\n[id=\"O2990445286\"] .page-content {\n\ttext-align: left;\n\talign-items: flex-start;\n\tbackground-color: #ffffff;\n}","display":true,"stack":false,"pin":false,"overlay":true,"password_enabled":false,"page_count":0,"page_design_options":null,"backdrops":{"activeBackdrop":"none"},"pin_options":{},"overlay_options":{"closeOnClickout":true,"closeOnNavigate":true,"closeOthersOnOpen":false,"closeSelf":false,"closeDelay":0,"transitionIntensity":1,"animateOnOpen":{"fade":true,"speed":0.4,"slideAmount":0,"slideDirection":"default","wipeShape":"default","easing":"smooth","scaleAmount":0,"rotateAmount":0},"animateOnClose":{"fade":true,"speed":0.4,"slideAmount":0,"slideDirection":"default","wipeShape":"default","easing":"smooth","scaleAmount":0,"rotateAmount":0},"transitionPreset":"fade"},"thumb_media_id":81993639,"thumbnail":{"id":81993639,"master_muid":15139111,"name":"horizontal pan=\"4\">\u003cdiv style=\"text-align: right\">\u003ca href=\"#\" rel=\"close-overlay\">(Close)\u003c/a>\u003c/div>\u003c/column-unit>\u003c/column-set>\u003cbr />\n\u003ccolumn-set gutter=\"1\">\u003ccolumn-unit slot=\"0\" span=\"3\">Graphic designer and visual artist, based in London.\u003cbr />\n\u003cbr />I make an artist's world work for a brand, and a brand's world work for an artist: brand partnerships, and the branded content that launches them.\u003cbr />\n\u003cbr />Over 4 years of experience within a fast-paced artist's studio, Philip Colbert's. There I've worked on high-end collectable artworks, documentaries, global exhibition advertisements, paintings, books and football stadium animations, and on his brand partnerships with Johnnie Walker, adidas and ASUS. \u003cspan class=\"ph\">[[FACT: confirm Aidan worked on all three partnerships]]\u003c/span>\u003cbr />\n\u003cbr />Outside the studio I design for music and nightlife (flyers, record sleeves, music videos, a tattoo studio's identity), host monthly radio mixes, and make my own work from found imagery and archival research.\u003cbr />\n\u003cbr />A designer with a strong interest in the arts, contemporary culture, and navigating creative solutions through the power of design.\u003cbr />\n\u003cbr />Planning a brand partnership or branded content with an artist? \u003ca class=\"cta\" href=\"contact-form\" rel=\"history\">Get in touch\u003c/a>.\u003cbr />\n\u003cbr />\n\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">Hackney\u003cbr />\nLondon\u003cbr />\nUK\u003cbr />\n\u003cbr />\n\u003ca href=\"contact-form\" rel=\"history\">aidanspeat@gmail.com\u003c/a>\u003cbr />\u003ca href=\"https://www.instagram.com/aidanspeat/\">@aidanspeat\u003c/a>\u003cbr />\n(+44) 07 514 159 561\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"6\">\u003cmedia-item class=\"zoomable\" hash=\"N3171073763280052760455287275801\">\u003c/media-item>\u003c/column-unit>\u003c/column-set>\u003cbr />\n\u003cbr />","loc page_type":"page","content":"\u003cspan class=\"caption\" style=\"\">\u003cdigital-clock pad-day-of-month=\"false\" pad-hour=\"false\" pad-minute=\"true\" truncate-year=\"false\" twentyfour-hour=\"false\" value=\"{day}, {month-name} {day-of-month}, {year} {hour}:{minute} {period}\">\u003c/digital-clock>\u003c/span>","local_css":"[id=\"H0408665835\"] .page-content {\n\tpadding-top: 20rem;\n\tpadding-left: 0.5rem;\n}\n\n[id=\"H0408665835\"] .page-layout {\n\tmax-width: 50%;\n}\n\n[id=\"H0408665835\"].page {\n\tjustify-content: flex-end;\n}","display":true,"stack":false,"pin":true,"overlay":false,"password_enabled":false,"page_count":0,"page_design_options":null,"backdrops":{"activeBackdrop":"none"},"pin_options":{"screen_visibility":"desktop","position":"bottom","overlay":true,"fixed":false,"adjust":true},"overlay_options":{},"thumb_media_id":null,"thumbnail":null,"thumb_meta":[],"media":[],"tags":[],"access_level":"public"},"J2026101101":{"id":"J2026101101","title":"Johnnie Walker × Philip Colbert","purl":"colbert-johnnie-walker","page_type":"page","content":"\u003ccolumn-set gutter=\"1\" mobile-stack=\"false\">\u003ccolumn-unit slot=\"0\" span=\"10\">Johnnie Walker × Philip Colbert\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"2\">\u003cdiv style=\"text-align: right\">\u003ca href=\"#\" rel=\"close-overlay\">(Close)\u003c/a>\u003c/div>\u003c/column-unit>\u003c/column-set>\n\u003cdiv class=\"cs-kicker\">\u003ca href=\"pc-project\" rel=\"history\">Philip Colbert, 2022–2026\u003c/a> · Brand partnership\u003c/div>\n\u003ch2 class=\"cs-headline\">Scotch heritage meets Mr. Lobster: limited gift boxes made to be collected.\u003c/h2>\n\u003cdiv class=\"cs-standfirst\">Johnnie Walker brought its top-shelf Blue Label and XR21 whiskies. Philip Colbert brought Mr. Lobster, the cartoon alter ego at the centre of his pop world. The result is a pair of gift sets that look like Johnnie Walker and feel like a Colbert edition.\u003c/div>\n\u003cdl class=\"cs-glance\">\n\u003cdiv>\u003cdt>Partners\u003c/dt>\u003cdd>Johnnie Walker × Philip Colbert\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>Launched\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[FACT: launch date and market. Press reports 29 July 2024, Taiwan]]\u003c/span>\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>My role\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[FACT: Aidan's exact role / what he designed]]\u003c/span>\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>The set\u003c/dt>\u003cdd>Blue Label and XR21 gift boxes, a co-branded glass, a lobster-shaped glass stand\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>Reach\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[METRIC: markets / territories launched in]]\u003c/span>\u003c/dd>\u003c/div>\n\u003c/dl>\n\u003cmedia-item class=\"zoomable\" hash=\"O3169203921647700650025645637913\">\u003cfigcaption class=\"caption\" slot=\"caption\">Johnnie Walker Blue Label, Philip Colbert edition\u003c/figcaption>\u003c/media-item>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">The two brands\u003c/div>\u003cdiv class=\"cs-pair\">\u003cdiv>\u003ch3>Johnnie Walker\u003c/h3>\u003cp>Scotch whisky with more than two centuries of blending behind it. Blue Label and XR21 sit at the top of the range: bottles people buy to give, and to mark an occasion. \u003cspan class=\"ph\">[[FACT: the audience this edition was aimed at]]\u003c/span>\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Philip Colbert\u003c/h3>\u003cp>A London-based pop artist often called the \"godson of Andy Warhol\", with a global following for his cartoon lobster persona. His work crosses old-master and art-history themes with everyday symbols of mass culture.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">The brand bridge\u003c/div>\u003cp>Each box keeps what makes the whisky recognisable and lets Mr. Lobster take over the rest. Blue Label stays in its deep blue, with Mr. Lobster sitting on a full moon among clouds. XR21's warm gold is turned into a field of botanicals around a crowned lobster.\u003c/p>\u003cp>The set goes beyond the box: a glass carries both names, and it sits on a gold lobster-shaped stand that makes the pour part of the artwork. For a whisky buyer it's a gift that stands out on the shelf. For a Colbert collector it's an edition worth keeping.\u003c/p>\u003cp>\u003cspan class=\"ph\">[[FACT: what Aidan kept from each brand, what he changed, and why. His own account of the bridge]]\u003c/span>\u003c/p>\u003c/div>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">Process\u003c/div>\u003cp>\u003cspan class=\"ph\">[[FACT: how the design developed, e.g. briefs, rounds, what was tried and dropped. No sketches or iterations are in the current media]]\u003c/span>\u003c/p>\u003c/div>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">The work\u003c/div>\u003cmedia-item class=\"zoomable\" hash=\"J3169206855676132549824668369177\">\u003cfigcaption class=\"caption\" slot=\"caption\">John Walker &#x26; Sons XR21 gift set: box, co-branded glass and gold lobster stand\u003c/figcaption>\u003c/media-item>\u003c/div>\n\u003cdiv class=\"impact\">\u003cdiv class=\"cs-label\">Impact\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: markets / territories launched in]]\" data-label=\"markets\">\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: sell-through / time to sell out]]\" data-label=\"sold through\" data-headline=\"true\">\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: Instagram engagement on launch post, likes/shares/saves]]\" data-label=\"engagements on the launch post\">\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: press coverage]]\" data-label=\"press features\">\u003c/div>\u003c/div>\n\u003cblockquote class=\"cs-quote\" data-quote=\"[[QUOTE: collaborator or client testimonial]]\" data-cite=\"[[FACT: name and role of the person quoted]]\">\u003c/blockquote>\n\u003cdl class=\"cs-credits\">\u003cdt>Artist\u003c/dt>\u003cdd>Philip Colbert\u003c/dd>\u003cdt>Brand\u003c/dt>\u003cdd>Johnnie Walker\u003c/dd>\u003cdt>Design\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[FACT: Aidan's exact role / what he designed]]\u003c/span>\u003c/dd>\u003cdt>Photography\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[FACT: photographer credit]]\u003c/span>\u003c/dd>\u003c/dl>\n\u003cdiv class=\"cs-next caption\">Next: \u003ca href=\"colbert-adidas\" rel=\"history\">adidas × Philip Colbert\u003c/a>\u003c/div>\u003cbr />\n\u003ccolumn-set gutter=\"1\" mobile-hide-empty=\"false\" mobile-stack=\"false\">\u003ccolumn-unit slot=\"0\" span=\"5\">\u003cspan class=\"caption\">(\u003ca href=\"#\" rel=\"close-overlay\">Return to projects\u003c/a>)\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"7\">\u003cspan class=\"caption\">2022 - 2026\u003c/span>\u003c/column-unit>\u003c/column-set>","local_css":"[id=\"J2026101101\"].page {\n\tjustify-content: flex-end;\n\tmin-height: var(--viewport-height);\n\tbackground-color: rgba(255, 255, 255, 0.95);\n}\n\n[id=\"J2026101101\"] .page-layout {\n\talign-items: flex-start;\n\tmax-width: 50%;\n}\n\n[id=\"J2026101101\"] .page-content {\n\ttext-align: left;\n\talign-items: flex-start;\n\tbackground-color: #ffffff;\n}","display":true,"stack":false,"pin":false,"overlay":true,"password_enabled":false,"page_count":0,"page_design_options":null,"backdrops":{"activeBackdrop":"none"},"pin_options":{},"overlay_options":{"closeOnClickout":true,"closeOnNavigate":true,"closeOthersOnOpen":false,"closeSelf":false,"closeDelay":0,"transitionIntensity":1,"animateOnOpen":{"fade":true,"speed":0.4,"slideAmount":0,"slideDirection":"default","wipeShape":"default","easing":"smooth","scaleAmount":0,"rotateAmount":0},"animateOnClose":{"fade":true,"speed":0.4,"slideAmount":0,"slideDirection":"default","wipeShape":"default","easing":"smooth","scaleAmount":0,"rotateAmount":0},"transitionPreset":"fade"},"thumb_media_id":null,"thumbnail":null,"thumb_meta":{"hide_from_index":true},"media":[{"id":88336885,"display_name":"Johnnie-Walker-Blue-Label--.jpg","name":"Johnnie-Walker-Blue-Label--.jpg","hash":"O3169203921647700650025645637913","width":2000,"height":1331,"file_size":1911014,"file_size_human":"1.8MB","file_type":"jpg","mime_type":"image/jpeg","is_image":true,"is_video":false,"is_url":false,"in_use":true,"created_at":"2026-10-07T11:01:29.015550Z","updated_at":"2026-10-07T11:01:29.015550Z"},{"id":88337286,"display_name":"Johnnie-Walker-XR--GWP.jpg","name":"Johnnie-Walker-XR--GWP.jpg","hash":"J3169206855676132549824668369177","width":2000,"height":1333,"file_size":1867803,"file_size_human":"1.8MB","file_type":"jpg","mime_type":"image/jpeg","is_image":true,"is_video":false,"is_url":false,"in_use":true,"created_at":"2026-10-07T11:04:08.265353Z","updated_at":"2026-10-07T11:04:08.265353Z"}],"tags":[],"access_level":"public"},"A2026101102":{"id":"A2026101102","title":"adidas × Philip Colbert","purl":"colbert-adidas","page_type":"page","content":"\u003ccolumn-set gutter=\"1\" mobile-stack=\"false\">\u003ccolumn-unit slot=\"0\" span=\"10\">adidas × Philip Colbert\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"2\">\u003cdiv style=\"text-align: right\">\u003ca href=\"#\" rel=\"close-overlay\">(Close)\u003c/a>\u003c/div>\u003c/column-unit>\u003c/column-set>\n\u003cdiv class=\"cs-kicker\">\u003ca href=\"pc-project\" rel=\"history\">Philip Colbert, 2022–2026\u003c/a> · Brand partnership\u003c/div>\n\u003ch2 class=\"cs-headline\">The Superstar, saved by a lobster: a classic sneaker turned into a Colbert piece people can wear.\u003c/h2>\n\u003cdiv class=\"cs-standfirst\">adidas brought the Superstar, one of its most recognisable shoes. Philip Colbert brought his lobster and a message, \"Save the Lobster\". The shoe keeps its shell toe and three stripes and lets Colbert's world cover the rest.\u003c/div>\n\u003cdl class=\"cs-glance\">\n\u003cdiv>\u003cdt>Partners\u003c/dt>\u003cdd>adidas × Philip Colbert\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>Released\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[FACT: release date. Not stated on the site]]\u003c/span>\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>My role\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[FACT: Aidan's exact role / what he designed]]\u003c/span>\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>The product\u003c/dt>\u003cdd>Superstar \"Save the Lobster\" \u003cspan class=\"ph\">[[FACT: confirm other pieces in the range, e.g. apparel]]\u003c/span>\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>Reach\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[METRIC: markets / territories launched in]]\u003c/span>\u003c/dd>\u003c/div>\n\u003c/dl>\n\u003cmedia-item class=\"zoomable\" hash=\"D3171045436090918290593634713881\">\u003cfigcaption class=\"caption\" slot=\"caption\">Superstar \"Save the Lobster\"\u003c/figcaption>\u003c/media-item>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">The two brands\u003c/div>\u003cdiv class=\"cs-pair\">\u003cdiv>\u003ch3>adidas\u003c/h3>\u003cp>The Superstar is a sports shoe that became street culture: white leather, three stripes, the rubber shell toe. Its audience already treats it as a canvas. \u003cspan class=\"ph\">[[FACT: the audience this release was aimed at]]\u003c/span>\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Philip Colbert\u003c/h3>\u003cp>A London-based pop artist with a global following for his cartoon lobster persona, whose work moves easily between gallery, toy shelf and street.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">The brand bridge\u003c/div>\u003cp>The silhouette stays pure adidas: white upper, black stripes, Superstar branding on the side. Colbert arrives as a repeat pattern of hand-lettered \"Save the Lobster\" slogans across the quarters, with the red lobster breaking out at the heel. From across a room it's a Superstar. Up close it's a Colbert.\u003c/p>\u003cp>\u003cspan class=\"ph\">[[FACT: what Aidan kept from each brand, what he changed, and why. His own account of the bridge]]\u003c/span>\u003c/p>\u003c/div>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">Process\u003c/div>\u003cp>\u003cspan class=\"ph\">[[FACT: how the design developed. No sketches or iterations are in the current media]]\u003c/span>\u003c/p>\u003c/div>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">The work\u003c/div>\u003cmedia-item class=\"zoomable\" hash=\"S3169206095153767878927274344729\">\u003cfigcaption class=\"caption\" slot=\"caption\">Hoodie with Colbert lobster graphic \u003cspan class=\"ph\">[[FACT: is this hoodie part of the adidas collaboration?]]\u003c/span>\u003c/figcaption>\u003c/media-item>\u003c/div>\n\u003cdiv class=\"impact\">\u003cdiv class=\"cs-label\">Impact\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: markets / territories launched in]]\" data-label=\"markets\">\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: sell-through / time to sell out]]\" data-label=\"sold through\" data-headline=\"true\">\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: Instagram engagement on launch post, likes/shares/saves]]\" data-label=\"engagements on the launch post\">\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: press coverage]]\" data-label=\"press features\">\u003c/div>\u003c/div>\n\u003cblockquote class=\"cs-quote\" data-quote=\"[[QUOTE: collaborator or client testimonial]]\" data-cite=\"[[FACT: name and role of the person quoted]]\">\u003c/blockquote>\n\u003cdl class=\"cs-credits\">\u003cdt>Artist\u003c/dt>\u003cdd>Philip Colbert\u003c/dd>\u003cdt>Brand\u003c/dt>\u003cdd>adidas\u003c/dd>\u003cdt>Design\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[FACT: Aidan's exact role / what he designed]]\u003c/span>\u003c/dd>\u003cdt>Photography\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[FACT: photographer credit]]\u003c/span>\u003c/dd>\u003c/dl>\n\u003cdiv class=\"cs-next caption\">Next: \u003ca href=\"colbert-asus\" rel=\"history\">ASUS × Philip Colbert\u003c/a> 309_ADV_46156.jpg","hash":"S3169206095153767878927274344729","width":1333,"height":2000,"file_size":1964727,"file_size_human":"1.9MB","file_type":"jpg","mime_type":"image/jpeg","is_image":true,"is_video":false,"is_url":false,"in_use":true,"created_at":"2026-10-07T11:03:26.813787Z","updated_at":"2026-10-07T11:03:26.813787Z"}],"tags":[],"access_level":"public"},"S2026101103":{"id":"S2026101103","title":"ASUS × Philip Colbert","purl":"colbert-asus","page_type":"page","content":"\u003ccolumn-set gutter=\"1\" mobile-stack=\"false\">\u003ccolumn-unit slot=\"0\" span=\"10\">ASUS × Philip Colbert\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"2\">\u003cdiv style=\"text-align: right\">\u003ca href=\"#\" rel=\"close-overlay\">(Close)\u003c/a>\u003c/div>\u003c/column-unit>\u003c/column-set>\n\u003cdiv class=\"cs-kicker\">\u003ca href=\"pc-project\" rel=\"history\">Philip Colbert, 2022–2026\u003c/a> · Brand partnership\u003c/div>\n\u003ch2 class=\"cs-headline\">A laptop sold as a collectable: the Vivobook 13 Slate OLED, Philip Colbert Edition.\u003c/h2>\n\u003cdiv class=\"cs-standfirst\">ASUS brought a 13.3-inch detachable OLED laptop. Philip Colbert brought his lobster. Together they made a tech product you unbox like an art edition, with Colbert's artwork on the device, its accessories and its packaging.\u003c/div>\n\u003cdl class=\"cs-glance\">\n\u003cdiv>\u003cdt>Partners\u003c/dt>\u003cdd>ASUS × Philip Colbert\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>Announced\u003c/dt>\u003cdd>May 2022\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>My role\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[FACT: Aidan's exact role / what he designed]]\u003c/span>\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>The bundle\u003c/dt>\u003cdd>Printed box, laptop sleeve, lobster stylus holder, stickers, shoelaces\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>Reach\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[METRIC: markets / territories launched in]]\u003c/span>\u003c/dd>\u003c/div>\n\u003c/dl>\n\u003cmedia-item class=\"zoomable\" hash=\"Y3171041900975330748968872575257\">\u003cfigcaption class=\"caption\" slot=\"caption\">Vivobook 13 Slate OLED, Philip Colbert Edition: the full bundle\u003c/figcaption>\u003c/media-item>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">The two brands\u003c/div>\u003cdiv class=\"cs-pair\">\u003cdiv>\u003ch3>ASUS\u003c/h3>\u003cp>A Taipei-based technology brand. The Vivobook 13 Slate OLED is a detachable Windows laptop that comes with a pen. \u003cspan class=\"ph\">[[FACT: the audience this edition was aimed at]]\u003c/span>\u003c/p>\u003c/div>\u003cdiv>\u003ch3>Philip Colbert\u003c/h3>\u003cp>A London-based pop artist with a global following for his cartoon lobster persona and its world of eggs, eyes and lightning bolts.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">The brand bridge\u003c/div>\u003cp>ASUS released the Colbert edition as one of two limited artist editions, so the job was to make a laptop feel worth collecting. Everything around the device carries Colbert's world: a sticker-bombed box, a \"COLBERT\" sleeve, a lobster figure that holds the stylus and red shoelaces. The laptop itself stays a working ASUS machine, with Colbert's artwork on screen.\u003c/p>\u003cp>\u003cspan class=\"ph\">[[FACT: what Aidan kept from each brand, what he changed, and why. His own account of the bridge]]\u003c/span>\u003c/p>\u003c/div>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">Process\u003c/div>\u003cp>\u003cspan class=\"ph\">[[FACT: how the design developed. No sketches or iterations are in the current media]]\u003c/span>\u003c/p>\u003c/div>\n\u003cdiv class=\"impact\">\u003cdiv class=\"cs-label\">Impact\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"1 of 2\" data-label=\"limited artist editions\">\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: markets / territories launched in]]\" data-label=\"markets\">\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: sell-through / time to sell out]]\" data-label=\"sold through\" data-headline=\"true\">\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: press coverage]]\" data-label=\"press features\">\u003c/div>\u003c/div>\n\u003cblockquote class=\"cs-quote\" data-quote=\"[[QUOTE: collaborator or client testimonial]]\" data-cite=\"[[FACT: name and role of the person quoted]]\">\u003c/blockquote>\n\u003cdl class=\"cs-credits\">\u003cdt>Artist\u003c/dt>\u003cdd>Philip Colbert\u003c/dd>\u003cdt>Brand\u003c/dt>\u003cdd>ASUS\u003c/dd>\u003cdt>Design\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[FACT: Aidan's exact role / what he designed]]\u003c/span>\u003c/dd>\u003cdt>Photography\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[FACT: photographer credit]]\u003c/span>\u003c/dd>\u003c/dl>\n\u003cdiv class=\"cs-next caption\">Next: \u003ca href=\"colbert-shenzhen\" rel=\"history\">Shenzhen solo exhibition\u003c/a>\u003c/div>\u003cbr />\n\u003ccolumn-set gutter=\"1\" mobile-hide-empty=\"false\" mobile-stack=\"false\">\u003ccolumn-unit slot=\"0\" span=\"5\">\u003cspan class=\"caption\">(\u003ca href=\"#\" rel=\"close-overlay\">Return to projects\u003c/a>)\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"7\">\u003cspan class=\"caption\">2022 - 2026\u003c/span>\u003c/column-unit>\u003c/column-set>","local_css":"[id=\"S2026101103\"].page {\n\tjustify-content: flex-end;\n\tmin-height: var(--viewport-height);\n\tbackground-color: rgba(255, 255, 255, 0.95);\n}\n\n[id=\"S2026101103\"] .page-layout {\n\talign-items: flex-start;\n\tmax-width: 50%;\n}\n\n[id=\"S2026101103\"] .page-content {\n\ttext-align: left;\n\talign-items: flex-start;\n\tbackground-color: #ffffff;\n}","display":true,"stack":false,"pin":false,"overlay":true,"password_enabled":false,"page_count":0,"page_design_options":null,"backdrops":{"activeBackdrop":"none"},"pin_options":{},"overlay_options":{"closeOnClickout":true,"closeOnNavigate":true,"closeOthersOnOpen":false,"c s=\"cs-glance\">\n\u003cdiv>\u003cdt>Venue\u003c/dt>\u003cdd>Sea World Culture and Arts Center, Shekou, Shenzhen\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>Dates\u003c/dt>\u003cdd>17 June – 15 October 2023\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>Organisers\u003c/dt>\u003cdd>Pearl Lam Galleries and COEXIST\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>My role\u003c/dt>\u003cdd>\u003cspan class=\"ph\">[[FACT: what Aidan designed, e.g. key visual, banners, signage, print]]\u003c/span>\u003c/dd>\u003c/div>\n\u003cdiv>\u003cdt>Scale\u003c/dt>\u003cdd>40+ works\u003c/dd>\u003c/div>\n\u003c/dl>\n\u003cmedia-item class=\"zoomable\" hash=\"R3171027368907050641689752764697\">\u003cfigcaption class=\"caption\" slot=\"caption\">Façade banners and flags at the Sea World Culture and Arts Center\u003c/figcaption>\u003c/media-item>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">The graphic system\u003c/div>\u003cp>The façade carries the show at street scale: a full-height banner pairing Colbert's octopus-lobster sculpture with a bilingual title lockup, 龙虾创世 and The Myth of the Lobster Planet, and the dates set large enough to read from across the road. Vertical flags repeat the Chinese title.\u003c/p>\u003cp>\u003cspan class=\"ph\">[[FACT: the rest of the system Aidan designed: wayfinding, wall text, print, social. No photos of these are in the current media]]\u003c/span>\u003c/p>\u003c/div>\n\u003cdiv class=\"cs-section\">\u003cdiv class=\"cs-label\">The same thinking, other cities\u003c/div>\u003cp>The exhibition campaigns in Rome, Naples, Taipei and Macao are on the \u003ca href=\"pc-project\" rel=\"history\">Philip Colbert series page\u003c/a>.\u003c/p>\u003c/div>\n\u003cdiv class=\"impact\">\u003cdiv class=\"cs-label\">Impact\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"40+\" data-label=\"works on show\">\u003c/div>\u003cdiv class=\"impact-stat\" data-value=\"[[METRIC: exhibition attendance]]\" data-label=\"visitors\" data-headline=\"true\">\u003c/div>\u003cd
